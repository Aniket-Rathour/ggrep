name: Go CI

# This tells the robot to run whenever you push code to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # The robot will use a temporary Linux computer
    
    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # Change this if you are using a different Go version

    - name: Run go vet
      run: go vet ./...

    - name: Run tests with race detector
      run: go test -race ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest